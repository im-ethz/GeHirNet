[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gehirnet"
version = "0.1.0"
description = "Sex-aware hierarchical voice pathology classification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
dependencies = ["numpy>=1.24", "torch>=2.6,<2.7", "torchvision>=0.21,<0.22", "torchaudio>=2.6,<2.7", "soundfile>=0.12", "scikit-learn>=1.3"]

[project.optional-dependencies]
analysis = ["pandas", "openpyxl", "scipy", "matplotlib", "seaborn", "umap-learn"]

[project.scripts]
gehirnet = "gehirnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
